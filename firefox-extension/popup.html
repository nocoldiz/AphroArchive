<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Link Scraper</h1>
    <div class="mode-toggle">
      <label><input type="radio" name="mode" value="manual"> Manual</label>
      <label><input type="radio" name="mode" value="auto"> Auto</label>
    </div>
  </header>

  <button id="scrapeBtn" class="primary">Scrape Current Page</button>

  <input id="filter" type="text" placeholder="Filter regex (e.g. watch|episode|\.mp4)">

  <div class="count">Links: <span id="count">0</span></div>

  <ul id="links"></ul>

  <footer>
    <button id="copyBtn">Copy List</button>
    <button id="exportBtn">Export .txt</button>
    <button id="clearBtn" class="danger">Clear</button>
    <a href="#" id="optionsLink">Options</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
