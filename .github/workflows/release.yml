name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated: windows,linux,mac,android,electron)'
        required: false
        default: 'windows,linux,mac,android'
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    if: >-
      (startsWith(github.ref, 'refs/tags/v') &&
        (github.ref_name != '')) ||
      contains(github.event.inputs.platforms || 'windows,linux,mac,android', 'windows')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (desktop)
        run: npx vite build

      - name: Package Windows executable
        run: npx pkg . --targets node24-win-x64 --output dist/AphroArchive.exe --compress GZip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AphroArchive-windows
          path: dist/AphroArchive.exe
          if-no-files-found: error

  build-electron:
    name: Build Windows Electron Installer
    runs-on: windows-latest
    if: >-
      (startsWith(github.ref, 'refs/tags/v')) ||
      contains(github.event.inputs.platforms || '', 'electron')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build

      - name: Build Electron installer
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Electron artifact
        uses: actions/upload-artifact@v4
        with:
          name: AphroArchive-electron
          path: dist/electron/
          if-no-files-found: warn

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    if: >-
      (startsWith(github.ref, 'refs/tags/v')) ||
      contains(github.event.inputs.platforms || 'windows,linux,mac,android', 'linux')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (desktop)
        run: npx vite build

      - name: Package Linux executable
        run: npx pkg . --targets node24-linux-x64 --output dist/AphroArchive-linux --compress GZip

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AphroArchive-linux
          path: dist/AphroArchive-linux
          if-no-files-found: error

  build-mac:
    name: Build macOS (arm64 + x64)
    runs-on: macos-latest
    if: >-
      (startsWith(github.ref, 'refs/tags/v')) ||
      contains(github.event.inputs.platforms || 'windows,linux,mac,android', 'mac')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (desktop)
        run: npx vite build

      - name: Package macOS arm64
        run: npx pkg . --targets node24-macos-arm64 --output dist/AphroArchive-macos-arm64 --compress GZip

      - name: Package macOS x64
        run: npx pkg . --targets node24-macos-x64 --output dist/AphroArchive-macos-x64 --compress GZip

      - name: Create .app bundle
        run: |
          STAGE="dist/mac-stage"
          mkdir -p "$STAGE/AphroArchive.app/Contents/MacOS"
          mkdir -p "$STAGE/AphroArchive.app/Contents/Resources"

          cp dist/AphroArchive-macos-arm64 "$STAGE/AphroArchive-macos-arm64"
          cp dist/AphroArchive-macos-x64 "$STAGE/AphroArchive-macos-x64"
          rm dist/AphroArchive-macos-arm64 dist/AphroArchive-macos-x64

          # Create Info.plist
          cat > "$STAGE/AphroArchive.app/Contents/Info.plist" << 'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>CFBundleExecutable</key>
  <string>launcher</string>
  <key>CFBundleIdentifier</key>
  <string>com.aphroarchive.app</string>
  <key>CFBundleName</key>
  <string>AphroArchive</string>
  <key>CFBundleDisplayName</key>
  <string>AphroArchive</string>
  <key>CFBundleVersion</key>
  <string>1.0.0</string>
  <key>CFBundleShortVersionString</key>
  <string>1.0</string>
  <key>CFBundlePackageType</key>
  <string>APPL</string>
  <key>LSMinimumSystemVersion</key>
  <string>11.0</string>
  <key>NSHighResolutionCapable</key>
  <true/>
</dict>
</plist>
PLIST

          # Create launcher script
          cat > "$STAGE/AphroArchive.app/Contents/MacOS/launcher" << 'LAUNCHER'
#!/bin/bash
set -e
APP_DIR="$(cd "$(dirname "$0")/../../.." && pwd)"
ARCH=$(uname -m)
if [ "$ARCH" = "arm64" ]; then
  BIN="$APP_DIR/AphroArchive-macos-arm64"
else
  BIN="$APP_DIR/AphroArchive-macos-x64"
fi
chmod +x "$BIN" 2>/dev/null || true
exec "$BIN" "$@"
LAUNCHER
          chmod +x "$STAGE/AphroArchive.app/Contents/MacOS/launcher"

          # Create zip archive
          cd "$STAGE"
          zip -r ../AphroArchive-mac.zip .
          cd ../..

          echo "Created dist/AphroArchive-mac.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AphroArchive-macos
          path: dist/AphroArchive-mac.zip
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: >-
      (startsWith(github.ref, 'refs/tags/v')) ||
      contains(github.event.inputs.platforms || 'windows,linux,mac,android', 'android')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Android web assets
        run: npx vite build --mode android

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android-app/android
        run: ./gradlew assembleDebug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Locate and upload APK
        run: |
          APK=$(find android-app/android -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found!"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/AphroArchive.apk
          echo "Copied $APK to dist/AphroArchive.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: AphroArchive-android
          path: dist/AphroArchive.apk
          if-no-files-found: error

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-mac, build-android]
    if: startsWith(github.ref, 'refs/tags/v') && success()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: AphroArchive-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AphroArchive ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          body: |
            ## AphroArchive ${{ github.ref_name }}

            ### Downloads
            - **Windows**: `AphroArchive.exe`
            - **Linux**: `AphroArchive-linux`
            - **macOS**: `AphroArchive-mac.zip` (Universal: arm64 + x64)
            - **Android**: `AphroArchive.apk`

            ### Usage
            1. Download the appropriate binary for your platform
            2. Run it — the server will start on `http://127.0.0.1:3000`
            3. Open your browser to that address

            > **Note**: macOS users may need to right-click → Open to bypass Gatekeeper.
          draft: false
          prerelease: contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha')
          files: release-artifacts/*